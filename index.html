<meta name="app-version" content="v1.26 (2026-08-17)">
<style>
  :root{
    --bg:#fafafa; --ink:#222; --sub:#666; --line:#dcdcdc; --line2:#c8c8c8;
    --chip:#eef0f2; --accent:#5b7fa6;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:"BIZ UDPGothic","Yu Gothic UI","Noto Sans CJK JP",sans-serif; color:var(--ink); background:var(--bg); overflow-x:hidden; }
  button{ font-family:inherit; }

  /* ---- header ---- */
  header{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
    padding:8px 14px; background:#fff; border-bottom:1px solid var(--line); }
  header .title{ font-weight:700; font-size:16px; margin-right:2px; }
  header .ver{ font-size:10.5px; color:#aaa; margin-right:6px; align-self:flex-end; padding-bottom:2px; }
  #search{ flex:1; max-width:420px; padding:7px 12px; border:1px solid var(--line2); border-radius:20px; font-size:13.5px; }
  .hbtn{ border:1px solid var(--line2); background:#fff; border-radius:6px; padding:6px 10px; font-size:12.5px; cursor:pointer; color:#333; }
  .hbtn:hover{ background:#f2f2f2; }
  .spacer{ flex:1; }
  #acct{ font-size:12px; color:var(--sub); }

  /* ---- layout ---- */
  .main{ display:flex; align-items:flex-start; }
  aside{ position:sticky; top:53px; width:190px; flex:none; padding:14px 10px; height:calc(100vh - 53px); overflow:auto; border-right:1px solid var(--line); background:#fcfcfc; }
  aside .grp{ font-size:11px; color:#999; margin:10px 6px 4px; }
  .navitem{ display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:8px; font-size:13px; cursor:pointer; color:#333; }
  .navitem:hover{ background:#eee; }
  .navitem.active{ background:#e6edf5; color:#123; font-weight:600; }
  .navitem.sub{ padding-left:20px; }
  .navitem.tagrow2{ padding-left:8px; gap:4px; }
  .cbcell{ width:18px; display:inline-flex; justify-content:center; flex:none; }
  .cbcell.h{ font-weight:700; color:#888; font-size:10px; }
  .tck{ margin:0; cursor:pointer; }
  .tlbl{ cursor:pointer; }
  .taghead{ display:flex; align-items:center; gap:4px; padding:0 8px 4px; font-size:10px; color:#999; }
  .colorfilter{ display:flex; flex-wrap:wrap; gap:7px; padding:4px 10px 6px; }
  .navitem .cnt{ margin-left:auto; font-size:11px; color:#999; }
  .navgroup{ font-size:11.5px; color:#555; cursor:pointer; padding:5px 8px; margin-top:3px; font-weight:600; user-select:none; }
  .navgroup:hover{ background:#eee; border-radius:6px; }
  .content{ flex:1; padding:16px; }

  /* ---- compose ---- */
  .compose{ max-width:600px; margin:0 auto 20px; background:#fff; border:1px solid var(--line2); border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); padding:10px 12px; }
  .compose textarea{ width:100%; border:0; resize:none; font:inherit; font-size:14px; outline:none; min-height:24px; background:transparent; }
  .compose.dropover{ outline:2px dashed var(--accent); outline-offset:2px; }
  .card.fileover{ outline:2px dashed var(--accent); }
  .compose .row{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .taginput{ border:1px dashed var(--line2); border-radius:6px; padding:3px 8px; font:inherit; font-size:12px; width:130px; }
  .mini{ border:1px solid var(--line2); background:#fff; border-radius:6px; padding:4px 9px; font-size:12px; cursor:pointer; }
  .mini:hover{ background:#f2f2f2; }
  .addbtn{ margin-left:auto; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:6px 16px; font-size:13px; cursor:pointer; }
  .addbtn:hover{ filter:brightness(.95); }

  /* ---- color dots ---- */
  .dots{ display:flex; gap:5px; }
  .dot{ width:18px; height:18px; border-radius:50%; border:1px solid #bbb; cursor:pointer; }
  .dot.sel{ outline:2px solid #333; outline-offset:1px; }

  /* ---- grid & cards ---- */
  #grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; align-items:start; max-width:1200px; }
  .card{ border:1px solid var(--line2); border-radius:10px; padding:10px 12px 8px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.05); display:flex; flex-direction:column; gap:6px; position:relative; }
  .card.drag{ opacity:.4; }
  .card.archived{ border-style:dashed; border-color:#9a9a9a; border-width:1.5px; background-image:repeating-linear-gradient(45deg, rgba(0,0,0,0.035) 0 8px, transparent 8px 16px); }
  .arcbadge{ align-self:flex-start; background:#6b6b6b; color:#fff; font-size:10px; font-weight:600; border-radius:4px; padding:1px 8px; letter-spacing:.5px; }
  .card.over{ outline:2px dashed var(--accent); }
  .card.selected{ outline:2px solid var(--accent); outline-offset:1px; }
  #selbar{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); display:none; align-items:center; gap:8px; background:#333; color:#fff; padding:8px 12px; border-radius:10px; box-shadow:0 3px 14px rgba(0,0,0,.25); z-index:80; flex-wrap:wrap; max-width:94vw; }
  .selcount{ font-size:12.5px; font-weight:700; margin-right:4px; }
  .selbtn{ background:#4c4c4c; color:#fff; border:0; border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer; }
  .selbtn:hover{ background:#5e5e5e; }
  .card textarea{ width:100%; border:0; resize:none; font:inherit; font-size:13.5px; line-height:1.6; outline:none; background:transparent; overflow:hidden; }
  .card .firstline{ font-weight:700; }
  .chips{ display:flex; flex-wrap:wrap; gap:4px; }
  .chip{ display:inline-flex; align-items:center; gap:3px; background:var(--chip); border:1px solid #d7dbe0; border-radius:11px; padding:0 8px; font-size:11px; color:#445; }
  .chip .x{ cursor:pointer; color:#889; font-weight:700; }
  .atts{ display:flex; flex-wrap:wrap; gap:6px; }
  .links{ display:flex; flex-direction:column; gap:6px; }
  .linkcard{ display:flex; gap:8px; text-decoration:none; color:inherit; border:1px solid var(--line2); border-radius:8px; overflow:hidden; background:#fff; }
  .linkthumb{ width:120px; height:68px; object-fit:cover; flex:none; background:#eee; }
  .linkmeta{ padding:6px 8px; min-width:0; }
  .linktitle{ font-size:12px; font-weight:600; color:#223; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-all; }
  .linksite{ font-size:10.5px; color:#999; margin-top:3px; }
  .linkchip{ display:inline-flex; align-items:center; gap:5px; text-decoration:none; color:#456; border:1px solid var(--line2); border-radius:8px; padding:3px 8px; font-size:11.5px; background:#fafafa; max-width:100%; }
  .favicon{ width:14px; height:14px; flex:none; }
  .linkchip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mapchip{ background:#eef3f7; border-color:#9db8cf; color:#2b4a63; }
  .att-img{ width:64px; height:64px; object-fit:cover; border-radius:6px; border:1px solid var(--line2); cursor:pointer; }
  .att-file{ display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line2); border-radius:6px; padding:2px 7px; font-size:11px; color:#445; cursor:pointer; background:#fafafa; max-width:100%; }
  .att-file .rm,.att-img-wrap .rm{ cursor:pointer; color:#a55; font-weight:700; }
  .att-img-wrap{ position:relative; }
  .att-img-wrap .rm{ position:absolute; top:-6px; right:-6px; background:#fff; border:1px solid var(--line2); border-radius:50%; width:16px; height:16px; line-height:14px; text-align:center; font-size:11px; }
  .cardfoot{ display:flex; align-items:center; gap:6px; margin-top:2px; border-top:1px solid #eee; padding-top:5px; }
  .cardfoot .date{ font-size:10.5px; color:#aaa; margin-right:auto; }
  .icon{ border:0; background:transparent; cursor:pointer; font-size:14px; color:#888; padding:2px 4px; border-radius:5px; }
  .icon:hover{ background:#eee; color:#333; }
  .handle{ cursor:grab; color:#bbb; }
  .taginput.sm{ width:90px; }

  /* ---- popover / modal ---- */
  .pop{ position:absolute; z-index:30; background:#fff; border:1px solid var(--line2); border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,.15); padding:8px; }
  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:50; display:flex; align-items:center; justify-content:center; }
  .modal{ background:#fff; border-radius:10px; padding:18px 20px; width:min(580px,94vw); max-height:82vh; overflow:auto; }
  .modal h3{ margin:0 0 12px; font-size:15px; }
  .tagrow{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; padding:5px 0; border-bottom:1px solid #eee; font-size:13px; }
  .mini:disabled{ opacity:.32; cursor:default; }
  .tagrow .nm{ flex:1; }
  .modal .close{ margin-top:14px; text-align:right; }
  .mapmodal{ background:#fff; border-radius:10px; width:min(920px,96vw); height:min(80vh,760px); display:flex; flex-direction:column; overflow:hidden; }
  .mapbar{ display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); }

  #drawerBtn{ display:none; }

    header{ flex-wrap:wrap; padding:8px 10px; gap:6px; }

    body.drawer-open aside{ transform:translateX(0); }

    .compose{ max-width:none; }
    #grid{ grid-template-columns:1fr; max-width:none; }
  }
</style>
</head>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
"use strict";
/* ============================================================
   メモ（Keep風）— 単一HTML / Googleドライブ保存(drive.file)
   ============================================================ */
const APP_VERSION = "v1.26 (2026-08-17)";
const CONFIG = {
  CLIENT_ID: "162155904085-ud13pisfjodgim2t19q9n2us70ekc9n4.apps.googleusercontent.com",
  SCOPE: "https://www.googleapis.com/auth/drive.file",
  FOLDER_NAME: "メモツール",
  NOTES_FILE: "notes.json",
  MAX_ATT_MB: 20,
};
const PALETTE = [
  {key:"none",   name:"なし",     hex:"#ffffff"},
  {key:"gray",   name:"グレー",   hex:"#f1f3f4"},
  {key:"yellow", name:"イエロー", hex:"#fdf3c7"},
  {key:"green",  name:"グリーン", hex:"#d9ead3"},
  {key:"blue",   name:"ブルー",   hex:"#d0e2f3"},
  {key:"red",    name:"レッド",   hex:"#f4d9d7"},
  {key:"purple", name:"パープル", hex:"#e6dcf0"},
];
const hexOf = k => (PALETTE.find(p=>p.key===k)||PALETTE[0]).hex;

const MOCK = new URLSearchParams(location.search).has("mock");

/* ---------- state ---------- */
let state = {
  notes: [],
  book: new URLSearchParams(location.search).get("book") || "",  // メモ帳キー（""＝既定）
  books: [],           // メモ帳一覧 [{key,name}]
  tagDefs: [],         // マスタータグ一覧（メモ未使用でも保持）
  groups: [],          // タググループ [{name, tags:[...]}]
  collapsed: new Set(),// 折りたたみ中のグループ名
  view: "ALL",         // ALL | ARCHIVE
  orTags: new Set(),   // 「いずれか(OR)」列で選択中のタグ
  andTags: new Set(),  // 「必須(AND)」列で選択中のタグ
  colors: new Set(),   // 色で絞り込み（複数選択でOR）
  selected: new Set(), // 複数選択中のカードID
  q: "",
  sort: "updated",     // updated | manual
  composeColor: "none",
  composeAtts: [],     // pending {name,type,size,_file/_url}
};
let dirty = false, saveTimer = null;

/* ---------- utils ---------- */
const $  = s => document.querySelector(s);
const el = (t,c)=>{const e=document.createElement(t); if(c)e.className=c; return e;};
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowISO = () => new Date().toISOString();
function notesFileName(){ return state.book ? ("notes-"+state.book+".json") : "notes.json"; }
const esc = s => (s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function fmtDate(iso){ if(!iso) return ""; const d=new Date(iso); const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function fmtSize(b){ if(b<1024)return b+"B"; if(b<1048576)return (b/1024).toFixed(0)+"KB"; return (b/1048576).toFixed(1)+"MB"; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1600); }
function extractTags(text){ const set=new Set(); const re=/#([^\s#　]+)/g; let m; while((m=re.exec(text))) set.add(m[1]); return [...set]; }

/* ============================================================
   Store 抽象化: DriveStore（本番） / MockStore（?mock=1 でテスト）
   ============================================================ */
let accessToken = null, tokenClient = null, folderId = null, notesFileId = null;

const DriveStore = {
  async api(path, opts={}){
    const res = await fetch("https://www.googleapis.com/"+path, {
      ...opts,
      headers:{ Authorization:"Bearer "+accessToken, ...(opts.headers||{}) },
    });
    if(res.status===401){ throw new Error("UNAUTH"); }
    return res;
  },
  async ensureFolder(){
    if(folderId) return folderId;
    const q = encodeURIComponent(`name='${CONFIG.FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    let r = await this.api("drive/v3/files?q="+q+"&fields=files(id,name)&spaces=drive");
    let j = await r.json();
    if(j.files && j.files.length){ folderId = j.files[0].id; return folderId; }
    r = await this.api("drive/v3/files", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:CONFIG.FOLDER_NAME, mimeType:"application/vnd.google-apps.folder"})});
    j = await r.json(); folderId = j.id; return folderId;
  },
  async findFile(name){
    await this.ensureFolder();
    const q = encodeURIComponent(`name='${name}' and '${folderId}' in parents and trashed=false`);
    const r = await this.api("drive/v3/files?q="+q+"&fields=files(id,name)");
    const j = await r.json();
    return (j.files && j.files[0]) ? j.files[0].id : null;
  },
  async readJson(name){
    const id = await this.findFile(name); if(!id) return null;
    const rc = await this.api("drive/v3/files/"+id+"?alt=media");
    return await rc.json();
  },
  async load(){ const d = await this.readJson(notesFileName()); return d || {version:1, notes:[]}; },
  async loadBooks(){ return await this.readJson("books.json"); },
  _multipart(metadata, blob){
    const boundary = "memoBoundary"+Math.random().toString(36).slice(2);
    const head = "--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(metadata)
      + "\r\n--"+boundary+"\r\nContent-Type: "+(blob.type||"application/octet-stream")+"\r\n\r\n";
    const tail = "\r\n--"+boundary+"--";
    const body = new Blob([head, blob, tail], {type:"multipart/related; boundary="+boundary});
    return {body, ct:"multipart/related; boundary="+boundary};
  },
  async writeJson(name, data){
    const id = await this.findFile(name);
    const meta = {name, mimeType:"application/json"}; if(!id) meta.parents=[folderId];
    const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
    const {body, ct} = this._multipart(meta, blob);
    const url = "upload/drive/v3/files"+(id?("/"+id):"")+"?uploadType=multipart&fields=id";
    await this.api(url, {method:id?"PATCH":"POST", headers:{"Content-Type":ct}, body});
  },
  async save(data){ await this.writeJson(notesFileName(), data); },
  async saveBooks(b){ await this.writeJson("books.json", {books:b}); },
  async uploadAttachment(file){
    await this.ensureFolder();
    const meta = {name:file.name, parents:[folderId]};
    const {body, ct} = this._multipart(meta, file);
    const r = await this.api("upload/drive/v3/files?uploadType=multipart&fields=id", {method:"POST", headers:{"Content-Type":ct}, body});
    const j = await r.json();
    return {id:uid("a_"), name:file.name, type:file.type||"application/octet-stream", size:file.size, driveFileId:j.id};
  },
  async attUrl(att){
    const r = await this.api("drive/v3/files/"+att.driveFileId+"?alt=media");
    const blob = await r.blob();
    return URL.createObjectURL(blob);
  },
  async deleteAttachment(att){
    try{ await this.api("drive/v3/files/"+att.driveFileId, {method:"DELETE"}); }catch(e){}
  }
};

const MockStore = {
  dkey(){ return "__memo_mock_"+(state.book||"main"); },
  async load(){ try{ return JSON.parse(localStorage.getItem(this.dkey())) || {version:1,notes:[]}; }catch(e){ return {version:1,notes:[]}; } },
  async save(data){ try{ localStorage.setItem(this.dkey(), JSON.stringify(data)); }catch(e){} },
  async loadBooks(){ try{ return JSON.parse(localStorage.getItem("__memo_mock_books__")); }catch(e){ return null; } },
  async saveBooks(b){ try{ localStorage.setItem("__memo_mock_books__", JSON.stringify({books:b})); }catch(e){} },
  async uploadAttachment(file){
    const url = await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(file); });
    return {id:uid("a_"), name:file.name, type:file.type||"application/octet-stream", size:file.size, _dataUrl:url};
  },
  async attUrl(att){ return att._dataUrl; },
  async deleteAttachment(){},
};
let store = MOCK ? MockStore : DriveStore;

/* ============================================================
   保存（デバウンス2秒） / データ整形
   ============================================================ */
function snapshot(){ return {version:1, updatedAt:nowISO(), notes:state.notes, tagDefs:state.tagDefs, tagGroups:state.groups}; }
function markDirty(){ dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush, 2000); }
async function flush(){
  if(!dirty) return; dirty=false;
  try{ await store.save(snapshot()); toast("保存しました"); }
  catch(e){ if(String(e.message).includes("UNAUTH")){ reauth(); } else { dirty=true; toast("保存に失敗（再試行します）"); clearTimeout(saveTimer); saveTimer=setTimeout(flush,4000);} }
}
window.addEventListener("beforeunload", e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });

/* ============================================================
   認証
   ============================================================ */
const TOK_KEY="__memo_tok__";
function storeToken(t,expiresIn){ try{ localStorage.setItem(TOK_KEY, JSON.stringify({t, e:Date.now()+((expiresIn||3600)*1000)-60000})); }catch(e){} }
function cachedToken(){ try{ const o=JSON.parse(localStorage.getItem(TOK_KEY)); if(o&&o.t&&o.e>Date.now()) return o.t; }catch(e){} return null; }
function clearToken(){ try{ localStorage.removeItem(TOK_KEY); }catch(e){} }
function reauth(){ if(tokenClient) tokenClient.requestAccessToken({prompt:""}); }
let autoDone=false;
// 接続ボタン（＋任意メッセージ）を表示する
function showConnect(msg){ autoDone=true; $("#connect").style.display=""; $("#ovmsg").textContent = msg||""; }
function initAuth(){
  if(MOCK){ afterAuth(); return; }
  if(!window.google || !google.accounts){ setTimeout(initAuth, 300); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID, scope: CONFIG.SCOPE,
    callback: (resp)=>{ autoDone=true;
      if(resp.error){ showConnect("認証エラー: "+resp.error); return; }
      accessToken = resp.access_token; storeToken(resp.access_token, resp.expires_in); afterAuth(); },
    // ポップアップブロック等でサイレント接続に失敗したとき
    error_callback: (err)=>{ showConnect(""); },
  });
  // 毎回の同意強制をやめる（初回は自動で同意、以降は無音）
  $("#connect").onclick = ()=> { $("#ovmsg").textContent="接続中…"; tokenClient.requestAccessToken({prompt:""}); };
  $("#ovmsg").textContent="";
  // 記憶したトークンが生きていれば、クリックも許可画面もなしで開く
  const ct=cachedToken();
  if(ct){ accessToken=ct; afterAuth(); return; }
  // 起動時サイレント自動接続：ログイン済み＆許可済みなら無音で入れる
  $("#connect").style.display="none"; $("#ovmsg").textContent="接続中…";
  try{ tokenClient.requestAccessToken({prompt:""}); }catch(e){ showConnect(""); }
  // フォールバック：一定時間で入れなければ手動ボタンを出す
  setTimeout(()=>{ if(!accessToken && !autoDone) showConnect(""); }, 3500);
}
async function afterAuth(){
  try{
    // メモ帳一覧（books.json）
    let breg = await store.loadBooks();
    if(!breg || !Array.isArray(breg.books) || !breg.books.length){ breg={books:[{key:"", name:"メモ"}]}; await store.saveBooks(breg.books); }
    state.books = breg.books;
    if(state.book && !state.books.find(b=>b.key===state.book)){
      if(bookFromPref){ state.book=""; }   // 記憶した帳が削除済みなら既定へ（復活させない）
      else { state.books.push({key:state.book, name:state.book}); await store.saveBooks(state.books); }
    }
    // 現在のメモ帳のデータ
    const data = await store.load();
    state.notes = (data.notes||[]).map(normalize);
    state.tagDefs = [...new Set([...(data.tagDefs||[]), ...state.notes.flatMap(n=>n.tags)])];
    state.groups = Array.isArray(data.tagGroups) ? data.tagGroups.map(g=>({name:g.name, tags:Array.isArray(g.tags)?g.tags:[]})) : [];
    // 記憶した絞り込みタグのうち、今は存在しないものは外す（空表示の防止）
    { const known=new Set(state.tagDefs);
      state.orTags=new Set([...state.orTags].filter(t=>known.has(t)));
      state.andTags=new Set([...state.andTags].filter(t=>known.has(t))); }
    $("#overlay").style.display="none";
    $("#acct").textContent = MOCK ? "（モック）" : "接続済み";
    renderBookSelector();
    renderAll();
    setTimeout(()=>$("#cText").focus(), 60);
  }catch(e){
    if(String(e.message).includes("UNAUTH")){ clearToken(); accessToken=null; $("#overlay").style.display="flex"; $("#ovmsg").textContent="再接続が必要です。「Googleに接続」を押してください。"; }
    else { $("#overlay").style.display="flex"; $("#ovmsg").textContent="読込エラー: "+e.message; }
  }
}
function normalize(n){
  return { id:n.id||uid("n_"), text:n.text||"", tags:Array.isArray(n.tags)?n.tags:[],
    color:n.color||"none", archived:!!n.archived, order:typeof n.order==="number"?n.order:0,
    attachments:Array.isArray(n.attachments)?n.attachments:[],
    geo:(n.geo && typeof n.geo.lat==="number") ? {addr:n.geo.addr, lat:n.geo.lat, lng:n.geo.lng} : null,
    createdAt:n.createdAt||nowISO(), updatedAt:n.updatedAt||n.createdAt||nowISO() };
}

/* ============================================================
   描画
   ============================================================ */
function allTags(){
  const m=new Map();
  state.notes.forEach(n=>{ if(n.archived)return; n.tags.forEach(t=>m.set(t,(m.get(t)||0)+1)); });
  const names=new Set([...(state.tagDefs||[]), ...m.keys()]);
  return [...names].map(t=>[t, m.get(t)||0]).sort((a,b)=>a[0].localeCompare(b[0],"ja"));
}
function registerTag(t){ t=(t||"").trim(); if(t && !state.tagDefs.includes(t)) state.tagDefs.push(t); }
function createTag(name){ name=(name||"").trim().replace(/^#/,""); if(!name) return false; if(!state.tagDefs.includes(name)){ state.tagDefs.push(name); markDirty(); renderAll(); } return true; }
/* ---- タググループ ---- */
function createGroup(name){ name=(name||"").trim(); if(!name) return false; if(!state.groups.find(g=>g.name===name)){ state.groups.push({name, tags:[]}); markDirty(); renderAll(); } return true; }
function deleteGroup(name){ state.groups=state.groups.filter(g=>g.name!==name); markDirty(); renderAll(); }
function groupOf(tag){ const g=state.groups.find(g=>g.tags.includes(tag)); return g?g.name:null; }
function setTagGroup(tag, groupName){
  state.groups.forEach(g=>{ g.tags=g.tags.filter(t=>t!==tag); });
  if(groupName){ const g=state.groups.find(x=>x.name===groupName); if(g && !g.tags.includes(tag)) g.tags.push(tag); }
  markDirty(); renderAll();
}
const COLLAPSE_KEY="__memo_collapsed__";
function loadCollapsed(){ try{ const a=JSON.parse(localStorage.getItem(COLLAPSE_KEY)); if(Array.isArray(a)) state.collapsed=new Set(a); }catch(e){} }
function saveCollapsed(){ try{ localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...state.collapsed])); }catch(e){} }

/* ---------- 前回の状態を記憶（メモ帳・絞り込み・並び順） ---------- */
const PREF_KEY="__memo_prefs__";
let bookFromPref=false;
function readPrefs(){ try{ return JSON.parse(localStorage.getItem(PREF_KEY))||{}; }catch(e){ return {}; } }
function loadPrefs(){
  const p=readPrefs();
  const hasBookParam = new URLSearchParams(location.search).has("book");
  // メモ帳：URLに ?book= 指定が無ければ、前回開いていたメモ帳を復元
  if(!hasBookParam && typeof p.lastBook==="string"){ state.book=p.lastBook; bookFromPref=true; }
  // そのメモ帳の絞り込み・並び順・ビューを復元
  const bp = (p.books && p.books[state.book||""]) || null;
  if(bp){
    if(bp.view==="ALL"||bp.view==="ARCHIVE") state.view=bp.view;
    if(bp.sort==="updated"||bp.sort==="manual") state.sort=bp.sort;
    state.orTags = new Set(Array.isArray(bp.or)?bp.or:[]);
    state.andTags= new Set(Array.isArray(bp.and)?bp.and:[]);
    state.colors = new Set(Array.isArray(bp.colors)?bp.colors:[]);
  }
}
function savePrefs(){
  try{
    const p=readPrefs();
    p.lastBook = state.book||"";
    p.books = p.books||{};
    p.books[state.book||""] = {
      view: state.view, sort: state.sort,
      or:[...state.orTags], and:[...state.andTags], colors:[...state.colors]
    };
    localStorage.setItem(PREF_KEY, JSON.stringify(p));
  }catch(e){}
}
/* ---- 並べ替え ---- */
function moveInArray(arr,i,dir){ const j=i+dir; if(j<0||j>=arr.length)return false; const x=arr[i]; arr[i]=arr[j]; arr[j]=x; return true; }
function moveGroup(name,dir){ const i=state.groups.findIndex(g=>g.name===name); if(i<0)return; if(moveInArray(state.groups,i,dir)){ markDirty(); renderAll(); } }
function moveTagInGroup(gname,tag,dir){ const g=state.groups.find(x=>x.name===gname); if(!g)return; const i=g.tags.indexOf(tag); if(i<0)return; if(moveInArray(g.tags,i,dir)){ markDirty(); renderAll(); } }
function ungroupedOrdered(){
  const grouped=new Set(state.groups.flatMap(g=>g.tags));
  const counts=new Map(allTags());
  const arr=state.tagDefs.filter(t=>counts.has(t)&&!grouped.has(t));
  [...counts.keys()].forEach(t=>{ if(!grouped.has(t)&&!arr.includes(t)) arr.push(t); });
  return arr;
}
function moveUngroupedTag(tag,dir){
  const arr=ungroupedOrdered(); const pos=arr.indexOf(tag); const np=pos+dir; if(np<0||np>=arr.length)return;
  const other=arr[np]; const ia=state.tagDefs.indexOf(tag), ib=state.tagDefs.indexOf(other); if(ia<0||ib<0)return;
  const x=state.tagDefs[ia]; state.tagDefs[ia]=state.tagDefs[ib]; state.tagDefs[ib]=x; markDirty(); renderAll();
}

function mkNav(label,{active=false,count="",onClick,sub=false}={}){
  const d=el("div","navitem"+(active?" active":"")+(sub?" sub":""));
  const s=el("span"); s.textContent=label; d.appendChild(s);
  if(count!==""){ const c=el("span","cnt"); c.textContent=count; d.appendChild(c); }
  if(onClick) d.onclick=onClick;
  return d;
}
function clearTagSel(){ state.orTags.clear(); state.andTags.clear(); }
function anyTagSel(){ return state.orTags.size>0 || state.andTags.size>0; }
function tagNav(t,count){
  const on = state.orTags.has(t) || state.andTags.has(t);
  const d=el("div","navitem tagrow2"+(on?" active":""));

function visibleNotes(){
  const q=state.q.trim().toLowerCase();
  const orT=[...state.orTags], andT=[...state.andTags];
  const applyTags=(l)=>{
    if(orT.length) l=l.filter(n=> orT.some(t=>n.tags.includes(t)));
    if(andT.length) l=l.filter(n=> andT.every(t=>n.tags.includes(t)));
    return l;
  };
  const applyColor=(l)=> state.colors.size ? l.filter(n=> state.colors.has(n.color)) : l;
  let list=state.notes.slice();
  if(q){
    // 検索時はアーカイブも対象
    list=list.filter(n=> n.text.toLowerCase().includes(q) || n.tags.some(t=>t.toLowerCase().includes(q)) );
    list=applyColor(applyTags(list));
  }else{
    if(state.view==="ARCHIVE") list=applyColor(list.filter(n=>n.archived));
    else if(anyTagSel()||state.colors.size) list=applyColor(applyTags(list)); // 絞り込み時はアーカイブも含む
    else list=list.filter(n=>!n.archived);
  }
  if(state.sort==="updated") list.sort((a,b)=> (b.updatedAt||"").localeCompare(a.updatedAt||""));
  else list.sort((a,b)=> (a.order||0)-(b.order||0));
  return list;
}

/* ---------- URLプレビュー（YouTube等はサムネ＋タイトル／その他はファビコン＋リンク） ---------- */
function parseYouTube(url){
  const m=url.match(/(?:youtube\.com\/(?:watch\?[^ ]*v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  return m?m[1]:null;
}
function extractAddress(text){
  // 「住所：〜」の行を拾う（全角/半角コロン対応）
  const m=text.match(/住所\s*[：:]\s*([^\n]+)/);
  return m?m[1].trim():null;
}
function siteName(host){
  host=host.replace(/^www\./,"");
  const map={ "tabelog.com":"食べログ","gnavi.co.jp":"ぐるなび","hotpepper.jp":"ホットペッパー",
    "x.com":"X","twitter.com":"X","instagram.com":"Instagram","facebook.com":"Facebook",
    "amazon.co.jp":"Amazon","amazon.com":"Amazon","note.com":"note","github.com":"GitHub",
    "maps.google.com":"Googleマップ","google.com":"Google","goo.gl":"Google" };
  return map[host]||host;
}
function renderLinks(n, box){
  box.innerHTML="";
  const urls=[...new Set((n.text.match(/https?:\/\/[^\s<>"'）】」]+/g)||[]))];
  for(const url of urls){
    const yt=parseYouTube(url);
    if(yt){
      const card=el("a","linkcard"); card.href=url; card.target="_blank"; card.rel="noopener";
      const img=el("img","linkthumb"); img.src="https://img.youtube.com/vi/"+yt+"/hqdefault.jpg"; img.alt="YouTube";
      const meta=el("div","linkmeta"); const t=el("div","linktitle"); t.textContent=url;
      const s=el("div","linksite"); s.textContent="▶ YouTubeで開く";
      meta.appendChild(t); meta.appendChild(s); card.appendChild(img); card.appendChild(meta); box.appendChild(card);
      // タイトルはoEmbedからベストエフォートで取得（取れなくてもサムネは出る）
      fetch("https://www.youtube.com/oembed?url="+encodeURIComponent(url)+"&format=json")
        .then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.title) t.textContent=j.title; }).catch(()=>{});
    }else{
      const chip=el("a","linkchip"); chip.href=url; chip.target="_blank"; chip.rel="noopener";
      let host=url; try{ host=new URL(url).hostname; }catch(e){}
      const fav=el("img","favicon"); fav.src="https://"+host+"/favicon.ico"; fav.onerror=()=>{ fav.style.display="none"; };
      const sp=el("span"); sp.textContent="🔗 "+siteName(host)+"で開く";
      chip.appendChild(fav); chip.appendChild(sp); box.appendChild(chip);
    }
  }
  // 住所があれば「地図で開く」チップ
  const addr=extractAddress(n.text);
  if(addr){
    const chip=el("a","linkchip mapchip"); chip.target="_blank"; chip.rel="noopener"; chip.title=addr;
    chip.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(addr);
    const sp=el("span"); sp.textContent="🗺 地図で開く： "+addr;
    chip.appendChild(sp); box.appendChild(chip);
  }
}
async function removeAttachment(n,a,box){
  n.attachments=n.attachments.filter(x=>x!==a); n.updatedAt=nowISO(); markDirty();
  if(!MOCK && a.driveFileId) store.deleteAttachment(a);
  renderAtts(n,box);
}
async function addAttachments(n, files, box){
  for(const file of files){
    if(file.size > CONFIG.MAX_ATT_MB*1048576){ toast(`${file.name} は${CONFIG.MAX_ATT_MB}MBを超えています`); continue; }
    try{ const att=await store.uploadAttachment(file); n.attachments.push(att); }catch(e){ toast("添付の保存に失敗"); }
  }
  n.updatedAt=nowISO(); markDirty(); renderAtts(n,box);
}

/* ---------- drag reorder (手動並び順のみ) ---------- */
let dragId=null;
function setupDrag(card,n,handle){
  handle.addEventListener("mousedown",()=>{ card.draggable=true; });
  handle.addEventListener("mouseup",()=>{ card.draggable=false; });
  card.addEventListener("dragstart",e=>{ if(state.sort!=="manual"){ e.preventDefault(); toast("『手動並び順』のときだけ並べ替えできます"); return; } dragId=n.id; card.classList.add("drag"); });
  card.addEventListener("dragend",()=>{ card.classList.remove("drag"); card.draggable=false; document.querySelectorAll(".card.over").forEach(x=>x.classList.remove("over")); });
  card.addEventListener("dragover",e=>{ const isFile=[...(e.dataTransfer.types||[])].includes("Files");
    if(isFile){ e.preventDefault(); card.classList.add("fileover"); return; }
    if(dragId&&dragId!==n.id){ e.preventDefault(); card.classList.add("over"); } });
  card.addEventListener("dragleave",()=>{ card.classList.remove("over"); card.classList.remove("fileover"); });
  card.addEventListener("drop",e=>{
    if(e.dataTransfer.files&&e.dataTransfer.files.length){ e.preventDefault(); card.classList.remove("fileover");
      addAttachments(n,[...e.dataTransfer.files], card.querySelector(".atts")); toast("カードに添付しました"); return; }
    e.preventDefault(); card.classList.remove("over"); if(!dragId||dragId===n.id)return; reorder(dragId,n.id); dragId=null; });
}
function reorder(fromId,toId){
  const list=visibleNotes();
  const ids=list.map(x=>x.id);
  const fi=ids.indexOf(fromId), ti=ids.indexOf(toId);
  if(fi<0||ti<0)return;
  ids.splice(ti,0,ids.splice(fi,1)[0]);
  ids.forEach((id,i)=>{ const nn=state.notes.find(x=>x.id===id); if(nn) nn.order=i; });
  markDirty(); renderGrid();
}

function addNoteFromCompose(){
  const text=$("#cText").value.trim();
  if(!text && state.composeAtts.length===0){ $("#cText").focus(); return; }
  const maxOrder=state.notes.reduce((m,x)=>Math.max(m,x.order||0),0);
  const n=normalize({ text, color:state.composeColor, order:maxOrder+1, tags:extractTags(text) });
  const extraTag=$("#cTag").value.trim().replace(/^#/,""); if(extraTag && !n.tags.includes(extraTag)) n.tags.push(extraTag);
  n.tags.forEach(registerTag);
  n.attachments=state.composeAtts.slice();
  state.notes.push(n);
  // reset
  $("#cText").value=""; $("#cTag").value=""; state.composeColor="none"; state.composeAtts=[];
  autoGrow($("#cText")); renderComposeDots(); renderComposePending();
  markDirty(); renderAll(); $("#cText").focus();
}

function openTagManager(){

  const cbtn=el("button","mini"); cbtn.textContent="＋ タグ作成";
  const doCreate=()=>{ if(createTag(ci.value)){ reopen(); } };
  cbtn.onclick=doCreate; ci.onkeydown=e=>{ if(e.key==="Enter") doCreate(); };

  gbtn.onclick=doG; gi.onkeydown=e=>{ if(e.key==="Enter") doG(); };
  grow.appendChild(gi); grow.appendChild(gbtn); m.appendChild(grow);

  const counts=new Map(allTags());
  const tagRow=(t,c,ord)=>{
    const row=el("div","tagrow");
    row.appendChild(btn("▲",()=>{ ord.up(); reopen(); }, ord.upDis));
    row.appendChild(btn("▼",()=>{ ord.down(); reopen(); }, ord.downDis));
    const nm=el("span","nm"); nm.textContent="# "+t+"　("+c+")"; row.appendChild(nm);
    const sel=el("select","mini");
    const o0=el("option"); o0.value=""; o0.textContent="（その他）"; sel.appendChild(o0);

    row.appendChild(sel);

    return row;
  };
  // グループ（並べ替え・削除）とその配下タグ
  state.groups.forEach((g,gi2)=>{
    const gh=el("div","tagrow"); gh.style.background="#eef0f2";
    gh.appendChild(btn("▲",()=>{ moveGroup(g.name,-1); reopen(); }, gi2===0));
    gh.appendChild(btn("▼",()=>{ moveGroup(g.name,1); reopen(); }, gi2===state.groups.length-1));
    const gn=el("span","nm"); gn.textContent="■ "+g.name; gn.style.fontWeight="700"; gh.appendChild(gn);
    gh.appendChild(btn("グループ削除",()=>{ if(confirm(`グループ「${g.name}」を削除します（タグ自体は残ります）。`)){ deleteGroup(g.name); reopen(); } }));

    const gtags=g.tags.filter(t=>counts.has(t));

    gtags.forEach((t,ti)=> m.appendChild(tagRow(t, counts.get(t)||0, {up:()=>moveTagInGroup(g.name,t,-1), down:()=>moveTagInGroup(g.name,t,1), upDis:ti===0, downDis:ti===gtags.length-1})));
  });
  // その他
  const others=ungroupedOrdered();
  if(others.length){
    const oh=el("div","tagrow"); oh.style.background="#eef0f2"; const on=el("span","nm"); on.textContent="■ その他"; on.style.fontWeight="700"; oh.appendChild(on); m.appendChild(oh);
    others.forEach((t,ti)=> m.appendChild(tagRow(t, counts.get(t)||0, {up:()=>moveUngroupedTag(t,-1), down:()=>moveUngroupedTag(t,1), upDis:ti===0, downDis:ti===others.length-1})));
  }
  if(!state.groups.length && !others.length){ const pp=el("p"); pp.style.cssText="color:#999;font-size:13px"; pp.textContent="タグはまだありません。上の欄で作成できます。"; m.appendChild(pp); }
  const cl=el("div","close"); const cb=el("button","mini"); cb.textContent="閉じる"; cb.onclick=()=>bg.remove(); cl.appendChild(cb); m.appendChild(cl);
  bg.appendChild(m); bg.onclick=e=>{ if(e.target===bg)bg.remove(); }; document.body.appendChild(bg);
}
function renameTag(from,to){
  state.tagDefs=[...new Set(state.tagDefs.map(t=>t===from?to:t))];
  state.groups.forEach(g=>{ g.tags=[...new Set(g.tags.map(t=>t===from?to:t))]; });
  state.notes.forEach(n=>{ if(n.tags.includes(from)){ n.tags=[...new Set(n.tags.map(t=>t===from?to:t))]; n.updatedAt=nowISO(); } });
  ["orTags","andTags"].forEach(k=>{ if(state[k].has(from)){ state[k].delete(from); state[k].add(to); } });
  markDirty(); renderAll();
}
function deleteTag(t){
  state.tagDefs=state.tagDefs.filter(x=>x!==t);
  state.groups.forEach(g=>{ g.tags=g.tags.filter(x=>x!==t); });
  state.notes.forEach(n=>{ if(n.tags.includes(t)){ n.tags=n.tags.filter(x=>x!==t); n.updatedAt=nowISO(); } });
  state.orTags.delete(t); state.andTags.delete(t);
  markDirty(); renderAll();
}

/* ============================================================
   menu: export / import
   ============================================================ */
/* ---------- CSV書き出し（Googleマイマップ取込用） ---------- */
function csvEscape(s){ s=(s==null?"":String(s)); return '"'+s.replace(/"/g,'""')+'"'; }
function csvField(s){ s=(s==null?"":String(s)); return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function writeMapCsv(notes){
  const header=["名前","住所","タグ","食べログ","動画","メモ"];
  const rows=notes.map(n=>{
    const title=(n.text.split("\n")[0]||"").trim();
    const addr=extractAddress(n.text);
    const urls=n.text.match(/https?:\/\/[^\s<>"'）】」]+/g)||[];
    const tabelog=urls.find(u=>/tabelog\.com/.test(u))||"";
    const yt=urls.find(u=>/youtu\.?be|youtube\.com/.test(u))||"";
    const memo=n.text.replace(/\s*\n\s*/g," / ").trim();
    return [title, addr, (n.tags||[]).join(" "), tabelog, yt, memo];
  });
  const csv=[header,...rows].map(r=>r.map(csvField).join(",")).join("\r\n");
  const bookName=((state.books||[]).find(b=>b.key===state.book)||{}).name||"メモ";
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="memo-map-"+bookName+".csv"; a.click();
  toast(notes.length+"件をCSV書き出ししました（マイマップにインポート）");
}
function exportMapCsv(){
  const notes=visibleNotes().filter(n=>extractAddress(n.text));
  if(!notes.length){ toast("表示中に『住所：…』付きのメモがありません"); return; }
  writeMapCsv(notes);
}

/* ============================================================
   複数選択 と 一括操作
   ============================================================ */
let lastAnchorId=null;
function toggleSelect(id){ if(state.selected.has(id)) state.selected.delete(id); else state.selected.add(id); lastAnchorId=id; renderAll(); }
function selectRangeTo(id){
  const ids=visibleNotes().map(n=>n.id);
  const i2=ids.indexOf(id); const i1=lastAnchorId?ids.indexOf(lastAnchorId):-1;
  if(i1<0){ state.selected.add(id); lastAnchorId=id; renderAll(); return; }
  const a=Math.min(i1,i2), b=Math.max(i1,i2);
  for(let k=a;k<=b;k++) state.selected.add(ids[k]);
  lastAnchorId=id; renderAll();
}
function clearSelection(){ state.selected.clear(); lastAnchorId=null; renderAll(); }
function selectedNotes(){ return state.notes.filter(n=>state.selected.has(n.id)); }
function renderSelectionBar(){
  const bar=$("#selbar"); if(!bar) return; const c=state.selected.size;
  if(!c){ bar.style.display="none"; bar.innerHTML=""; return; }
  bar.style.display="flex"; bar.innerHTML="";
  const cnt=el("span","selcount"); cnt.textContent=c+"件選択"; bar.appendChild(cnt);
  const mk=(label,fn)=>{ const b=el("button","selbtn"); b.textContent=label; b.onclick=fn; bar.appendChild(b); };
  mk("🎨 色", openBulkColor);
  mk("🏷 タグ追加", bulkAddTag);
  mk(state.view==="ARCHIVE"?"↩️ 戻す":"🗄 アーカイブ", bulkArchive);
  mk("🗑 削除", bulkDelete);
  mk("⬇️ CSV", bulkCsv);
  mk("✕ 解除", clearSelection);
}
function openBulkColor(e){
  closePops();
  const pop=el("div","pop"); const dots=el("div","dots");
  PALETTE.forEach(pc=>{ const d=el("span","dot"); d.style.background=pc.hex; d.title=pc.name;
    d.onclick=()=>{ selectedNotes().forEach(n=>{ n.color=pc.key; n.updatedAt=nowISO(); }); markDirty(); closePops(); renderAll(); };
    dots.appendChild(d); });
  pop.appendChild(dots); document.body.appendChild(pop);
  const r=e.target.getBoundingClientRect(); pop.style.left=(r.left+window.scrollX)+"px"; pop.style.top=(r.top+window.scrollY-48)+"px";
  setTimeout(()=>document.addEventListener("click",closePops,{once:true}),0);
}
function bulkAddTag(){
  const t=prompt("追加するタグ名（選択したメモ全部に付けます）"); if(!t||!t.trim())return;
  const tag=t.trim().replace(/^#/,"");
  selectedNotes().forEach(n=>{ if(!n.tags.includes(tag)){ n.tags.push(tag); n.updatedAt=nowISO(); } registerTag(tag); });
  markDirty(); renderAll(); toast("タグ「"+tag+"」を付けました");
}
function bulkArchive(){
  const toArc = state.view!=="ARCHIVE";
  selectedNotes().forEach(n=>{ n.archived=toArc; n.updatedAt=nowISO(); });
  markDirty(); clearSelection(); toast(toArc?"アーカイブしました":"通常に戻しました");
}
function bulkDelete(){
  const c=state.selected.size; if(!confirm(c+"件を完全に削除します。よろしいですか？（元に戻せません）"))return;
  selectedNotes().forEach(nt=>{ (nt.attachments||[]).forEach(a=>{ if(!MOCK&&a.driveFileId) store.deleteAttachment(a); }); });
  state.notes=state.notes.filter(nt=>!state.selected.has(nt.id));
  markDirty(); clearSelection(); toast("削除しました");
}
function bulkCsv(){
  const notes=selectedNotes().filter(n=>extractAddress(n.text));
  if(!notes.length){ toast("選択の中に『住所：…』付きのメモがありません"); return; }
  writeMapCsv(notes);
}

function openMenu(e){
  closePops();
  const pop=el("div","pop"); pop.style.right="14px"; pop.style.top="48px"; pop.style.position="fixed";
  const mk=(label,fn)=>{ const b=el("div","navitem"); b.textContent=label; b.onclick=()=>{ closePops(); fn(); }; pop.appendChild(b); };
  mk("🗺 CSV書き出し（マイマップ用）", exportMapCsv);
  mk("✎ このメモ帳の名前を変更", renameBook);
  mk("🗑 このメモ帳を削除", deleteBook);
  mk("⬇️ 書き出し（バックアップ）", exportData);
  mk("⬆️ 読み込み（復元）", importData);
  mk("💾 今すぐ保存", ()=>{ dirty=true; flush(); });
  document.body.appendChild(pop);
  setTimeout(()=>document.addEventListener("click",closePops,{once:true}),0);
}
async function exportData(){
  // 添付も含めて1ファイルに（Base64）
  const notes=JSON.parse(JSON.stringify(state.notes));
  for(const n of notes){ for(const a of (n.attachments||[])){ try{ const u=await store.attUrl(a); const r=await fetch(u); const b=await r.blob();
    a._b64=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b);}); }catch(e){} } }
  const blob=new Blob([JSON.stringify({version:1,exportedAt:nowISO(),notes},null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="memo-backup-"+nowISO().slice(0,10)+".json"; a.click();
}
function importData(){
  pickFiles(async files=>{
    const f=files[0]; if(!f)return; const txt=await f.text();
    let data; try{ data=JSON.parse(txt); }catch(e){ toast("読み込めませんでした"); return; }
    if(!confirm("現在のメモに読み込んだメモを追加します。よろしいですか？")) return;
    for(const n of (data.notes||[])){
      const nn=normalize(n); nn.id=uid("n_"); const newAtts=[];
      for(const a of (nn.attachments||[])){
        if(a._b64){ try{ const blob=await(await fetch(a._b64)).blob(); const file=new File([blob],a.name,{type:a.type}); const na=await store.uploadAttachment(file); newAtts.push(na); }catch(e){} }
      }
      nn.attachments=newAtts; state.notes.push(nn);
    }
    markDirty(); renderAll(); toast("読み込みました");
  }, ".json");
}

/* ---------- file picker / paste / drop ---------- */
function pickFiles(cb, accept){ const inp=el("input"); inp.type="file"; inp.multiple=true; if(accept)inp.accept=accept; inp.onchange=()=>cb([...inp.files]); inp.click(); }

async function renderComposePending(){
  const box=$("#cPending"); if(!box) return; box.innerHTML="";
  for(const a of state.composeAtts){
    if((a.type||"").startsWith("image/")){
      const wrap=el("span","att-img-wrap"); const img=el("img","att-img");
      try{ img.src=await store.attUrl(a); }catch(e){}
      img.onclick=()=>window.open(img.src,"_blank");
      const rm=el("span","rm"); rm.textContent="×"; rm.title="削除";
      rm.onclick=()=>{ state.composeAtts=state.composeAtts.filter(x=>x!==a); if(!MOCK&&a.driveFileId)store.deleteAttachment(a); renderComposePending(); };
      wrap.appendChild(img); wrap.appendChild(rm); box.appendChild(wrap);
    }else{
      const f=el("span","att-file"); f.innerHTML="📎 "+esc(a.name)+" <small>("+fmtSize(a.size)+")</small> <span class='rm'>×</span>";
      f.querySelector(".rm").onclick=()=>{ state.composeAtts=state.composeAtts.filter(x=>x!==a); if(!MOCK&&a.driveFileId)store.deleteAttachment(a); renderComposePending(); };
      box.appendChild(f);
    }
  }
}
async function addComposeFiles(files){
  let added=0;
  for(const file of files){
    if(file.size>CONFIG.MAX_ATT_MB*1048576){ toast(`${file.name} は${CONFIG.MAX_ATT_MB}MB超`); continue; }
    try{ const att=await store.uploadAttachment(file); state.composeAtts.push(att); added++; }catch(e){ toast("添付の保存に失敗"); }
  }
  if(added) renderComposePending();
  return added;
}
function setupComposeAttach(){
  $("#cAttach").onclick=()=>pickFiles(files=>addComposeFiles(files));
  const cText=$("#cText");
  cText.addEventListener("paste", async e=>{
    const files=[];
    for(const it of [...(e.clipboardData?.items||[])]){ if(it.type.startsWith("image/")){ const f=it.getAsFile(); if(f) files.push(f); } }
    if(files.length){ e.preventDefault(); await addComposeFiles(files); toast("画像を添付しました"); }
  });
  // ドラッグ＆ドロップ（新規メモへ）
  const comp=$("#compose");
  comp.addEventListener("dragover",e=>{ if([...(e.dataTransfer.types||[])].includes("Files")){ e.preventDefault(); comp.classList.add("dropover"); } });
  comp.addEventListener("dragleave",e=>{ if(!comp.contains(e.relatedTarget)) comp.classList.remove("dropover"); });
  comp.addEventListener("drop",e=>{ if(e.dataTransfer.files&&e.dataTransfer.files.length){ e.preventDefault(); comp.classList.remove("dropover"); addComposeFiles([...e.dataTransfer.files]); } });
  renderComposePending();
}

/* ============================================================
   render / events
   ============================================================ */
function refreshTagOptions(){ const dl=$("#tagOptions"); if(!dl)return; dl.innerHTML=""; allTags().forEach(([t])=>{ const o=el("option"); o.value=t; dl.appendChild(o); }); }
function renderAll(){ renderSide(); renderGrid(); refreshTagOptions(); renderSelectionBar(); }
function closeDrawer(){ document.body.classList.remove("drawer-open"); }

/* ---------- メモ帳（複数） ---------- */
function renderBookSelector(){
  const sel=$("#bookSel"); if(!sel) return; sel.innerHTML="";
  (state.books||[]).forEach(b=>{ const o=el("option"); o.value=b.key; o.textContent=b.name; if(b.key===state.book)o.selected=true; sel.appendChild(o); });
  const on=el("option"); on.value="__new__"; on.textContent="＋ 新規メモ帳…"; sel.appendChild(on);
}
async function switchBook(key){
  if(dirty){ try{ await flush(); }catch(e){} }
  const u=new URL(location.href); if(key) u.searchParams.set("book",key); else u.searchParams.delete("book"); location.href=u.toString();
}
async function createBook(){
  const name=prompt("新しいメモ帳の名前（例：備忘メモ）"); if(!name||!name.trim()){ renderBookSelector(); return; }
  const key="b"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  state.books.push({key, name:name.trim()});
  try{ await store.saveBooks(state.books); }catch(e){}
  switchBook(key);
}
async function renameBook(){
  const b=state.books.find(x=>x.key===state.book); if(!b) return;
  const nv=prompt("メモ帳の名前", b.name); if(nv&&nv.trim()){ b.name=nv.trim(); try{ await store.saveBooks(state.books); }catch(e){} renderBookSelector(); toast("名前を変更しました"); }
}
async function deleteBook(){
  if(!state.book){ alert("最初のメモ帳は削除できません。"); return; }
  const b=state.books.find(x=>x.key===state.book);
  if(!confirm(`メモ帳「${b?b.name:state.book}」を一覧から削除します。中のメモは表示されなくなります。よろしいですか？`)) return;
  state.books=state.books.filter(x=>x.key!==state.book);
  try{ await store.saveBooks(state.books); }catch(e){}
  switchBook("");
}

function bindEvents(){
  $("#search").addEventListener("input",e=>{ state.q=e.target.value; renderGrid(); });
  $("#sortBtn").onclick=()=>{ state.sort = state.sort==="updated"?"manual":"updated";
    $("#sortBtn").textContent = "並び："+(state.sort==="updated"?"更新日順":"手動並び順"); renderGrid(); };
  $("#menuBtn").onclick=openMenu;
  $("#bookSel").onchange=()=>{ const v=$("#bookSel").value; if(v==="__new__"){ createBook(); } else if(v!==state.book){ switchBook(v); } };
  $("#drawerBtn").onclick=()=>document.body.classList.toggle("drawer-open");
  $("#drawerBackdrop").onclick=closeDrawer;
  const cText=$("#cText");
  cText.addEventListener("input",()=>autoGrow(cText));
  cText.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){ addNoteFromCompose(); } });
  $("#cTag").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addNoteFromCompose(); } });
  $("#cAdd").onclick=addNoteFromCompose;
  renderComposeDots(); setupComposeAttach();
}

/* ---------- boot ---------- */
$("#ver").textContent = APP_VERSION;
loadCollapsed();
loadPrefs();
bindEvents();
initAuth();
</script>
